<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ Seafood Grotto - Order System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#e8e8e8;min-height:100vh;padding-bottom:70px;}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(135deg,#1a1a3e,#16213e);display:flex;align-items:center;justify-content:space-between;padding:8px 10px;box-shadow:0 2px 15px rgba(0,0,0,.5);}
.nav-title{font-size:16px;font-weight:700;color:#ffd700;white-space:nowrap;}
.nav-btns{display:flex;gap:4px;flex-wrap:wrap;}
.nav-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 8px;border-radius:8px;font-size:11px;cursor:pointer;position:relative;transition:all .2s;white-space:nowrap;}
.nav-btn:hover{background:rgba(255,255,255,.2);}
.nav-btn.active{background:#ffd700;color:#000;border-color:#ffd700;font-weight:600;}
.badge{position:absolute;top:-6px;right:-6px;background:#ff4757;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.sync-status{font-size:9px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600;display:inline-flex;align-items:center;gap:3px;}
.sync-status.online{background:rgba(46,213,115,.2);color:#2ed573;}
.sync-status.offline{background:rgba(255,71,87,.2);color:#ff4757;}
.sync-status .dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.sync-status.online .dot{background:#2ed573;animation:pulse 2s infinite;}
.sync-status.offline .dot{background:#ff4757;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.page{display:none;padding:56px 10px 20px;}
.page.active{display:block;}
.menu-switch-bar{display:flex;gap:6px;margin-bottom:12px;padding:4px 0;}
.menu-switch-btn{flex:1;padding:10px;border-radius:10px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#ccc;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;}
.menu-switch-btn:hover{border-color:#ffd700;color:#ffd700;}
.menu-switch-btn.active{background:#ffd700;color:#000;border-color:#ffd700;}
.menu-switch-btn.takeaway-btn.active{background:#2ed573;color:#000;border-color:#2ed573;}
.menu-switch-btn.saturday-btn.active{background:#ffa502;color:#000;border-color:#ffa502;}
.category-title{font-size:16px;font-weight:700;color:#ffd700;padding:12px 4px 8px;border-bottom:2px solid #ffd700;margin-top:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.category-title:first-child{margin-top:0;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px;}
.menu-item{background:linear-gradient(145deg,#1e1e3a,#252550);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;position:relative;text-align:center;user-select:none;min-height:70px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:all .15s;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.menu-item:hover{border-color:#ffd700;background:linear-gradient(145deg,#24244a,#2a2a5a);}
.menu-item:active{transform:scale(0.97);}
.menu-item .name{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:4px;color:#fff;pointer-events:none;}
.menu-item .price{font-size:14px;font-weight:700;color:#ffd700;pointer-events:none;}
.menu-item .qty-badge{position:absolute;top:-6px;right:-6px;background:#ff4757;color:#fff;border-radius:50%;width:24px;height:24px;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 2px 6px rgba(255,71,87,.5);pointer-events:none;}
.menu-item .desc{font-size:9px;color:#aaa;line-height:1.2;margin-top:2px;pointer-events:none;}
.menu-item.takeaway-item{border-color:rgba(46,213,115,.15);}
.menu-item.takeaway-item:hover{border-color:#2ed573;background:linear-gradient(145deg,#1a2e1a,#1e3a2e);}
.menu-item.saturday-item{border-color:rgba(255,165,2,.15);}
.menu-item.saturday-item:hover{border-color:#ffa502;background:linear-gradient(145deg,#2e2a1a,#3a301e);}
.menu-item-controls{display:flex;align-items:center;gap:8px;margin-top:6px;pointer-events:auto;position:relative;z-index:2;}
.menu-item-controls button{width:30px;height:30px;border-radius:50%;border:none;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;pointer-events:auto;}
.menu-item-controls .mi-minus{background:#ff4757;color:#fff;}
.menu-item-controls .mi-minus:hover{background:#ff6b7a;}
.menu-item-controls .mi-minus:active{transform:scale(0.9);}
.menu-item-controls .mi-plus{background:#2ed573;color:#fff;}
.menu-item-controls .mi-plus:hover{background:#7bed9f;}
.menu-item-controls .mi-plus:active{transform:scale(0.9);}
.menu-item-controls .mi-qty{font-size:15px;font-weight:700;min-width:22px;text-align:center;color:#ffd700;pointer-events:none;}
.cart-section{background:#1a1a35;border-radius:12px;padding:14px;margin-bottom:12px;}
.cart-section-title{font-size:15px;font-weight:700;color:#ffd700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.cart-item-card{background:linear-gradient(145deg,#1c1c38,#222248);border:2px solid rgba(255,215,0,.15);border-radius:12px;padding:12px;margin-bottom:10px;transition:all .2s;}
.cart-item-card:last-child{margin-bottom:0;}
.cart-item-card:hover{border-color:rgba(255,215,0,.3);}
.cart-item-card.split-card{border-left:4px solid #ffd700;}
.cart-item-card.simple-card{border-left:4px solid #3498db;}
.cart-item-card.takeaway-card{border-left:4px solid #2ed573;border-color:rgba(46,213,115,.2);}
.cart-item-card.takeaway-card:hover{border-color:rgba(46,213,115,.35);}
.cart-item-card.saturday-card{border-left:4px solid #ffa502;border-color:rgba(255,165,2,.2);}
.cart-item-card.saturday-card:hover{border-color:rgba(255,165,2,.35);}
.cart-item-row{display:flex;align-items:center;width:100%;justify-content:space-between;}
.cart-item-name{flex:1;font-size:13px;font-weight:600;min-width:0;padding-right:8px;}
.cart-item-price{font-size:12px;color:#aaa;width:55px;text-align:right;margin-right:8px;}
.cart-item-controls{display:flex;align-items:center;gap:6px;}
.cart-item-controls button{width:28px;height:28px;border-radius:50%;border:none;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.btn-minus{background:#ff4757;color:#fff;}
.btn-minus:hover{background:#ff6b7a;}
.btn-plus{background:#2ed573;color:#fff;}
.btn-plus:hover{background:#7bed9f;}
.cart-item-qty{font-size:14px;font-weight:700;min-width:20px;text-align:center;}
.cart-item-subtotal{font-size:14px;font-weight:700;color:#ffd700;width:65px;text-align:right;margin-left:8px;}
.cart-delete{background:none;border:none;color:#ff4757;font-size:18px;cursor:pointer;margin-left:6px;padding:4px;}
.cart-item-index{font-size:10px;color:#ffd700;background:rgba(255,215,0,.15);padding:2px 7px;border-radius:6px;margin-left:6px;font-weight:700;}
.cart-options-area{background:rgba(255,255,255,.03);border-radius:8px;padding:8px 10px;margin-top:8px;}
.cook-row{width:100%;padding:4px 0 2px;display:flex;flex-wrap:wrap;gap:4px;}
.cook-btn{padding:4px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#aaa;font-size:11px;cursor:pointer;transition:all .2s;}
.cook-btn:hover{border-color:#ffa502;color:#ffa502;}
.cook-btn.selected{background:#ffa502;color:#000;border-color:#ffa502;font-weight:600;}
.egg-row{width:100%;padding:4px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.egg-label{font-size:11px;color:#7bed9f;}
.egg-controls{display:flex;align-items:center;gap:5px;}
.egg-controls button{width:24px;height:24px;border-radius:50%;border:none;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.egg-controls .egg-minus{background:rgba(255,71,87,.6);color:#fff;}
.egg-controls .egg-plus{background:rgba(46,213,115,.6);color:#fff;}
.egg-controls .egg-qty{font-size:13px;font-weight:700;min-width:18px;text-align:center;color:#7bed9f;}
.egg-style-row{display:flex;flex-wrap:wrap;gap:4px;margin-left:8px;}
.egg-style-btn{padding:3px 10px;border-radius:10px;border:1px solid rgba(123,237,159,.2);background:rgba(123,237,159,.05);color:#7bed9f;font-size:10px;cursor:pointer;transition:all .2s;}
.egg-style-btn:hover{border-color:#7bed9f;}
.egg-style-btn.selected{background:#7bed9f;color:#000;border-color:#7bed9f;font-weight:600;}
.cart-source-tag{font-size:9px;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:600;}
.tag-main{background:rgba(255,215,0,.15);color:#ffd700;}
.tag-takeaway{background:rgba(46,213,115,.15);color:#2ed573;}
.tag-saturday{background:rgba(255,165,2,.15);color:#ffa502;}
.fee-row{width:100%;padding:4px 0 2px;display:flex;align-items:center;gap:8px;}
.fee-toggle{padding:4px 12px;border-radius:14px;border:1px solid rgba(52,152,219,.3);background:rgba(52,152,219,.08);color:#3498db;font-size:11px;cursor:pointer;transition:all .2s;user-select:none;}
.fee-toggle:hover{border-color:#3498db;}
.fee-toggle.active{background:#3498db;color:#fff;border-color:#3498db;font-weight:600;}
.fee-label{font-size:11px;color:#3498db;}
.drink-row{width:100%;padding:6px 0 2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.drink-label{font-size:13px;color:#e8a83e;font-weight:600;}
.drink-btn{padding:5px 14px;border-radius:16px;border:2px solid rgba(232,168,62,.25);background:rgba(232,168,62,.06);color:#e8a83e;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;user-select:none;}
.drink-btn:hover{border-color:#e8a83e;}
.drink-btn.selected{background:#e8a83e;color:#000;border-color:#e8a83e;font-weight:700;}
.sugar-row{width:100%;padding:4px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sugar-label{font-size:12px;color:#dfe6e9;font-weight:500;}
.sugar-controls{display:flex;align-items:center;gap:5px;}
.sugar-controls button{width:24px;height:24px;border-radius:50%;border:none;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sugar-controls .sugar-minus{background:rgba(255,71,87,.5);color:#fff;}
.sugar-controls .sugar-plus{background:rgba(46,213,115,.5);color:#fff;}
.sugar-controls .sugar-qty{font-size:13px;font-weight:700;min-width:18px;text-align:center;color:#dfe6e9;}
.cart-empty{text-align:center;padding:40px 20px;color:#666;font-size:14px;}
.sauce-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.sauce-item-name{font-size:13px;flex:1;}
.sauce-item-label{font-size:11px;color:#888;margin-right:10px;}
.extras-drink{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.extras-drink-name{font-size:13px;flex:1;}
.extras-drink-price{font-size:12px;color:#aaa;margin-right:10px;}
.notes-area{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px;color:#e8e8e8;font-size:13px;font-family:inherit;resize:vertical;min-height:60px;margin-top:6px;}
.notes-area:focus{outline:none;border-color:#ffd700;}
.notes-area::placeholder{color:#555;}
.cart-total-area{background:linear-gradient(135deg,#1a1a3e,#0f0f2a);border-radius:12px;padding:14px;margin-top:12px;}
.total-line{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;}
.total-line.grand{font-size:18px;font-weight:700;color:#ffd700;border-top:2px solid #ffd700;padding-top:10px;margin-top:8px;}
.btn-primary{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:10px;}
.btn-primary.gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000;}
.btn-primary.gold:hover{background:linear-gradient(135deg,#ffaa00,#ff8800);}
.btn-primary.green{background:linear-gradient(135deg,#2ed573,#17a053);color:#fff;}
.btn-primary.green:hover{background:linear-gradient(135deg,#17a053,#128a43);}
.btn-primary.blue{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;margin-top:10px;}
.btn-row .btn-primary{flex:1;}
.order-preview{background:#1a1a35;border-radius:12px;padding:14px;margin-bottom:12px;}
.order-line{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);}
.order-line .ol-name{flex:1;}
.order-line .ol-qty{width:40px;text-align:center;color:#aaa;}
.order-line .ol-price{width:60px;text-align:right;color:#ffd700;font-weight:600;}
.order-line-sub{font-size:10px;color:#ffa502;padding:0 0 4px 12px;}
.order-line-egg{font-size:10px;color:#7bed9f;padding:0 0 4px 12px;}
.order-line-fee{font-size:10px;color:#3498db;padding:0 0 4px 12px;}
.order-line-drink{font-size:11px;color:#e8a83e;padding:0 0 4px 12px;font-weight:500;}
.table-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.table-btn{padding:14px;border-radius:10px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#ccc;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;}
.table-btn:hover{border-color:#ffd700;color:#ffd700;}
.table-btn.selected{background:#ffd700;color:#000;border-color:#ffd700;}
.table-btn.takeaway{border-color:rgba(46,213,115,.3);color:#2ed573;}
.table-btn.takeaway:hover{border-color:#2ed573;}
.table-btn.takeaway.selected{background:#2ed573;color:#000;border-color:#2ed573;}
.table-btn.pending{border-color:rgba(255,165,2,.3);color:#ffa502;}
.table-btn.pending:hover{border-color:#ffa502;}
.table-btn.pending.selected{background:#ffa502;color:#000;border-color:#ffa502;}
.order-card{background:#1a1a35;border-radius:12px;margin-bottom:10px;overflow:hidden;border:1px solid rgba(255,255,255,.06);}
.order-card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;transition:background .2s;}
.order-card-header:hover{background:rgba(255,255,255,.03);}
.order-card-header .och-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.order-card-header .order-id{font-weight:700;color:#ffd700;font-size:14px;}
.order-card-header .order-table{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:6px;font-size:12px;}
.order-card-header .order-table.takeaway{background:rgba(46,213,115,.2);color:#2ed573;}
.order-card-header .order-table.pending{background:rgba(255,165,2,.2);color:#ffa502;}
.order-card-header .order-time{color:#888;font-size:12px;}
.order-card-header .order-total-small{font-weight:700;color:#ffd700;font-size:14px;}
.order-card-header .expand-icon{color:#888;font-size:18px;transition:transform .2s;}
.order-card.expanded .expand-icon{transform:rotate(180deg);}
.order-card-body{display:none;padding:0 14px 14px;border-top:1px solid rgba(255,255,255,.06);}
.order-card.expanded .order-card-body{display:block;padding-top:10px;}
.order-card-body .order-line{font-size:12px;}
.order-card-body .sauce-line{font-size:11px;color:#aaa;padding:4px 0;}
.order-card-body .notes-display{font-size:11px;color:#ffa502;padding:6px 0;font-style:italic;}
.btn-complete{width:100%;padding:10px;border:none;border-radius:8px;background:linear-gradient(135deg,#2ed573,#17a053);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .2s;}
.btn-complete:hover{background:linear-gradient(135deg,#17a053,#128a43);}
.btn-delete-order{width:100%;padding:10px;border:none;border-radius:8px;background:rgba(255,71,87,.15);color:#ff4757;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;transition:all .2s;border:1px solid rgba(255,71,87,.3);}
.btn-delete-order:hover{background:rgba(255,71,87,.3);}
.completed-card{opacity:.85;}
.stats-bar{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000;border-radius:12px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-around;text-align:center;}
.stats-bar .stat-num{font-size:22px;font-weight:800;}
.stats-bar .stat-label{font-size:11px;font-weight:500;margin-top:2px;}
.set-btn{padding:3px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#aaa;font-size:11px;cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap;}
.set-btn:hover{border-color:#e056fd;color:#e056fd;}
.set-btn.done{background:#e056fd;color:#fff;border-color:#e056fd;font-weight:700;}
.set-indicator{font-size:11px;color:#e056fd;font-weight:600;}
.price-menu-tab{display:flex;gap:6px;margin-bottom:12px;}
.price-menu-tab-btn{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#ccc;font-size:12px;font-weight:600;cursor:pointer;text-align:center;}
.price-menu-tab-btn.active{background:#ffd700;color:#000;border-color:#ffd700;}
.price-cat-title{font-size:14px;font-weight:700;color:#ffd700;padding:10px 0 6px;border-bottom:1px solid rgba(255,215,0,.3);margin-top:12px;}
.price-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:8px;}
.price-row .pr-name{flex:1;font-size:13px;min-width:0;}
.price-row .pr-original{font-size:11px;color:#666;text-decoration:line-through;width:50px;text-align:right;}
.price-row .pr-input{width:70px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 8px;color:#ffd700;font-size:14px;font-weight:700;text-align:right;font-family:inherit;}
.price-row .pr-input:focus{outline:none;border-color:#ffd700;}
.price-row .pr-input.changed{border-color:#2ed573;background:rgba(46,213,115,.1);}
.price-row .pr-reset{background:none;border:none;color:#ff4757;font-size:14px;cursor:pointer;padding:4px;opacity:.5;}
.price-row .pr-reset:hover{opacity:1;}
.price-save-msg{text-align:center;color:#2ed573;font-size:13px;font-weight:600;padding:8px;opacity:0;transition:opacity .3s;}
.price-save-msg.show{opacity:1;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;justify-content:center;align-items:center;}
.modal-overlay.show{display:flex;}
.modal{background:#1e1e3a;border-radius:16px;padding:24px;max-width:320px;width:90%;text-align:center;}
.modal h3{margin-bottom:12px;color:#ffd700;}
.modal p{margin-bottom:16px;font-size:14px;color:#ccc;}
.modal .btn-row{justify-content:center;}
.modal .btn-sm{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.modal .btn-cancel{background:rgba(255,255,255,.1);color:#ccc;}
.modal .btn-confirm{background:#2ed573;color:#fff;}
.modal .btn-danger{background:#ff4757;color:#fff;}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#2ed573;color:#000;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:3000;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.toast.warn{background:#ffa502;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:#0f0f1a;}::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}
@media(min-width:768px){.menu-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}.page{padding:56px 20px 20px;max-width:900px;margin:0 auto;}}
</style>
</head>
<body>
<nav class="nav">
<div class="nav-title">🍽️ Seafood Grotto <span class="sync-status offline" id="syncStatus"><span class="dot"></span>Connecting...</span></div>
<div class="nav-btns">
<button class="nav-btn active" onclick="showPage('menu')">📋Menu</button>
<button class="nav-btn" onclick="showPage('cart')">🛒Cart<span class="badge" id="cartBadge" style="display:none">0</span></button>
<button class="nav-btn" onclick="showPage('active')">🔥Active<span class="badge" id="activeBadge" style="display:none">0</span></button>
<button class="nav-btn" onclick="showPage('completed')">✅Done</button>
<button class="nav-btn" onclick="showPage('prices')">💲Price</button>
</div>
</nav>
<div class="page active" id="page-menu"></div>
<div class="page" id="page-cart"></div>
<div class="page" id="page-preview"></div>
<div class="page" id="page-active"></div>
<div class="page" id="page-completed"></div>

const noEggCats=["➕ EXTRAS","🍤 SIDE DISHES","🍨 DESSERTS","🍔 SNACKS","☕ BEVERAGES"];
function canAddEgg(id){if(itemSourceMap[id]!=='main')return false;const c=itemCatMap[id];return c&&!noEggCats.includes(c);}
function isBreakfast(id){return itemCatMap[id]===BREAKFAST_CAT;}
function needsSplit(id){return canAddEgg(id)||isBreakfast(id);}
function getCookOptions(id){if(itemSourceMap[id]==='saturday')return null;for(const r of cookRules){if(r.match(id))return r;}return null;}
function getServiceFee(id){if(itemSourceMap[id]!=='takeaway')return 0;const c=itemCatMap[id];if(c===TW_SEAFOOD_CAT)return TW_SEAFOOD_FEE;if(c===TW_BOX_CAT)return TW_BOX_FEE;return 0;}
function getTableClass(v){if(v==='Takeaway')return'takeaway';if(v==='Pending')return'pending';return'';}

function getCartQty(id){if(!cart[id])return 0;if(Array.isArray(cart[id]))return cart[id].length;return cart[id].qty||0;}
function getTotalCartCount(){let c=0;Object.keys(cart).forEach(id=>{c+=getCartQty(id);});Object.keys(extrasDrinkCart).forEach(id=>{c+=(extrasDrinkCart[id]?.qty||0);});return c;}
function getItemUnitPrice(id){return(allItemLookup[id]||{}).price||0;}
function getSplitItemTotal(id,idx){return getItemUnitPrice(id)+(cart[id][idx].eggs||0)*EGG_PRICE;}
function getSimpleItemTotal(id){const c=cart[id];if(!c)return 0;return getItemUnitPrice(id)*c.qty+(c.eatInFee?getServiceFee(id)*c.qty:0);}
function calcFoodTotal(){let t=0;Object.keys(cart).forEach(id=>{if(!cart[id])return;if(Array.isArray(cart[id]))cart[id].forEach((u,i)=>{t+=getSplitItemTotal(id,i);});else t+=getSimpleItemTotal(id);});return t;}
function calcFeeTotal(){let t=0;Object.keys(cart).forEach(id=>{if(!cart[id]||Array.isArray(cart[id]))return;const c=cart[id];if(c.eatInFee)t+=getServiceFee(id)*c.qty;});return t;}

ordersRef.on('value', snap => {
  const data = snap.val();
  if (data) {
    orders = Object.keys(data).map(k => {
      const o = data[k];
      o._key = k;
      o._expanded = !!expandedOrders[o.id];
      return o;
    });
  } else {
    orders = [];
  }
  firebaseReady = true;
  refreshCurrentPage();
  updateBadges();
});

counterRef.on('value', snap => {
  const v = snap.val();
  if (v !== null) orderCounter = v;
});

pricesRef.on('value', snap => {
  const data = snap.val();
  savedPrices = data || {};
  rebuildMenus();
  refreshCurrentPage();
});

function refreshCurrentPage() {
  const active = document.querySelector('.page.active');
  if (!active) return;
  const id = active.id;
  if (id === 'page-menu') renderMenu();
  else if (id === 'page-cart') renderCart();
  else if (id === 'page-preview') renderPreview();
  else if (id === 'page-active') renderActiveOrders();
  else if (id === 'page-completed') renderCompletedOrders();
  else if (id === 'page-prices') renderPriceEditor();
}

// ===== FIREBASE WRITE HELPERS =====
function fbSaveOrder(order) {
  const key = order._key || ordersRef.push().key;
  const clean = {...order};
  delete clean._key;
  delete clean._expanded;
  ordersRef.child(key).set(clean);
  return key;
}
function fbDeleteOrder(order) {
  if (order._key) ordersRef.child(order._key).remove();
}
function fbUpdateOrder(order, updates) {
  if (order._key) ordersRef.child(order._key).update(updates);
}
function fbSetCounter(val) {
  counterRef.set(val);
}
function fbSavePrice(id, price) {
  pricesRef.child(id).set(price);
}
function fbRemovePrice(id) {
  pricesRef.child(id).remove();
}
function fbClearAllOrders() {
  ordersRef.remove();
  counterRef.set(0);
}
function fbResetAllPrices() {
  pricesRef.remove();
}

  const ic=currentMenuTab==='takeaway'?'takeaway-item':currentMenuTab==='saturday'?'saturday-item':'';

    h+=`<div class="category-title">${cat.category}${cat.desc?`<span style="font-size:11px;color:#aaa;font-weight:400"> — ${cat.desc}</span>`:''}</div><div class="menu-grid">`;
    cat.items.forEach(item=>{const qty=getCartQty(item.id);
      h+=`<div class="menu-item ${ic}" onclick="menuItemClick(event,'${item.id}')">`;
      if(qty>0)h+=`<div class="qty-badge">${qty}</div>`;
      h+=`<div class="name">${item.name}</div><div class="price">$${item.price.toFixed(2)}</div>`;
      if(item.desc)h+=`<div class="desc">${item.desc}</div>`;
      if(qty>0)h+=`<div class="menu-item-controls"><button class="mi-minus" onclick="menuMinusClick(event,'${item.id}')">−</button><span class="mi-qty">${qty}</span><button class="mi-plus" onclick="menuPlusClick(event,'${item.id}')">+</button></div>`;
      h+=`</div>`;});h+='</div>';});
  el.innerHTML=h;
}

function renderCompletedOrders(){
  const el=document.getElementById('page-completed');const co=orders.filter(o=>o.status==='completed');let h='';const tr=co.reduce((s,o)=>s+o.total,0);

function buildOrderCard(order,showC){
  const exp=expandedOrders[order.id]?'expanded':'';const cls=order.status==='completed'?'order-card completed-card':'order-card';const tc=getTableClass(order.table);const isActive=order.status==='active';const isSet=order.isSet||false;
  let h=`<div class="${cls} ${exp}"><div class="order-card-header" onclick="toggleOrderExpand('${order.id}')"><div class="och-left"><span class="order-id">#${order.id}</span><span class="order-table ${tc}">${order.table}</span>`;
  if(isActive&&isSet)h+=`<span class="set-indicator">🍞☕ SET ✔</span>`;
  h+=`<span class="order-time">${order.time}${order.completedTime?' → '+order.completedTime:''}</span></div><div style="display:flex;align-items:center;gap:8px;">`;
  if(isActive)h+=`<span class="set-btn ${isSet?'done':''}" onclick="event.stopPropagation();toggleSet('${order.id}')">${isSet?'🍞☕ SET ✔':'SET'}</span>`;
  h+=`<span class="order-total-small">$${order.total.toFixed(2)}</span><span class="expand-icon">▼</span></div></div><div class="order-card-body">`;
  (order.items||[]).forEach(i=>{const itemTotal=i.price*i.qty+(i.eggCost||0)+(i.feeCost||0);
    h+=`<div class="order-line"><span class="ol-name">${i.name}</span><span class="ol-qty">x${i.qty}</span><span class="ol-price">$${itemTotal.toFixed(2)}</span></div>`;
    if(i.cook)h+=`<div class="order-line-sub">↳ ${i.cook}</div>`;
    if(i.eggs&&i.eggs>0)h+=`<div class="order-line-egg">🥚 +${i.eggs} Egg${i.eggs>1?'s':''}${i.eggStyle?' ('+i.eggStyle+')':''} — $${(i.eggCost||0).toFixed(2)}</div>`;
    if(i.freeDrink){let dt=`☕ Free: ${i.freeDrink}`;if(i.sugar&&i.sugar>0)dt+=` + ${i.sugar} sugar`;h+=`<div class="order-line-drink">${dt}</div>`;}else if(i.sugar&&i.sugar>0)h+=`<div class="order-line-drink">🍬 ${i.sugar} sugar</div>`;
    if(i.feeCost&&i.feeCost>0)h+=`<div class="order-line-fee">🍽️ Eat-in fee +$${i.feeCost.toFixed(2)}</div>`;
  });
  if(order.sauces&&order.sauces.length)h+=`<div class="sauce-line">🫙 ${order.sauces.join(', ')}</div>`;
  if(order.notes)h+=`<div class="notes-display">📝 ${order.notes}</div>`;
  h+=`<div class="total-line grand" style="font-size:15px;margin-top:8px;border-top:1px solid rgba(255,255,255,.1);padding-top:8px;"><span>Total</span><span>$${order.total.toFixed(2)}</span></div>`;
  if(showC)h+=`<button class="btn-complete" onclick="markComplete('${order.id}')">✅ Complete</button>`;
  h+=`<button class="btn-delete-order" onclick="deleteOrder('${order.id}')">🗑️ Delete</button></div></div>`;return h;
}

function updatePrice(id,val){const p=parseFloat(val);if(isNaN(p)||p<0)return;fbSavePrice(id,p);flashSaveMsg();}
function resetPrice(id){fbRemovePrice(id);flashSaveMsg();}
function resetAllPrices(){showModalDanger('Reset All','Reset ALL prices to defaults?',()=>{fbResetAllPrices();closeModal();flashSaveMsg();});}
function flashSaveMsg(){const m=document.getElementById('priceSaveMsg');if(!m)return;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2000);}

// ===== CART ACTIONS (LOCAL ONLY - cart is per-device) =====
function addToCart(id){const item=allItemLookup[id];if(!item)return;if(needsSplit(id)){if(!cart[id])cart[id]=[];cart[id].push({eggs:0,eggStyle:null,cook:null,freeDrink:null,sugar:0});}else{if(!cart[id])cart[id]={qty:0,cook:null,eatInFee:false};cart[id].qty++;}renderMenu();updateBadges();}
function menuMinus(id){if(!cart[id])return;if(Array.isArray(cart[id])){cart[id].pop();if(!cart[id].length)delete cart[id];}else{cart[id].qty--;if(cart[id].qty<=0)delete cart[id];}renderMenu();updateBadges();}
function deleteSplitItem(id,idx){if(!cart[id]||!Array.isArray(cart[id]))return;cart[id].splice(idx,1);if(!cart[id].length)delete cart[id];renderCart();renderMenu();updateBadges();}
function setSplitCook(id,idx,o){if(cart[id]&&cart[id][idx]){cart[id][idx].cook=cart[id][idx].cook===o?null:o;renderCart();}}
function splitEggPlus(id,idx){if(cart[id]&&cart[id][idx]){cart[id][idx].eggs=(cart[id][idx].eggs||0)+1;renderCart();}}
function splitEggMinus(id,idx){if(cart[id]&&cart[id][idx]&&cart[id][idx].eggs>0){cart[id][idx].eggs--;if(!cart[id][idx].eggs)cart[id][idx].eggStyle=null;renderCart();}}
function setSplitEggStyle(id,idx,s){if(cart[id]&&cart[id][idx]){cart[id][idx].eggStyle=cart[id][idx].eggStyle===s?null:s;renderCart();}}
function setSplitDrink(id,idx,d){if(cart[id]&&cart[id][idx]){cart[id][idx].freeDrink=cart[id][idx].freeDrink===d?null:d;renderCart();}}
function splitSugarPlus(id,idx){if(cart[id]&&cart[id][idx]){cart[id][idx].sugar=(cart[id][idx].sugar||0)+1;renderCart();}}
function splitSugarMinus(id,idx){if(cart[id]&&cart[id][idx]&&(cart[id][idx].sugar||0)>0){cart[id][idx].sugar--;renderCart();}}
function simpleCartPlus(id){if(cart[id]&&!Array.isArray(cart[id])){cart[id].qty++;renderCart();updateBadges();}}
function simpleCartMinus(id){if(!cart[id]||Array.isArray(cart[id]))return;if(cart[id].qty>1){cart[id].qty--;renderCart();updateBadges();}else simpleCartDelete(id);}
function simpleCartDelete(id){delete cart[id];renderCart();renderMenu();updateBadges();}
function setSimpleCook(id,o){if(cart[id]&&!Array.isArray(cart[id])){cart[id].cook=cart[id].cook===o?null:o;renderCart();}}
function toggleSimpleFee(id){if(cart[id]&&!Array.isArray(cart[id])){cart[id].eatInFee=!cart[id].eatInFee;renderCart();}}
function saucePlus(id){const s=sauceOptions.find(x=>x.id===id);if(!s)return;if(!sauceCart[id])sauceCart[id]={name:s.name,qty:0};sauceCart[id].qty++;renderPreview();}
function sauceMinus(id){if(sauceCart[id]&&sauceCart[id].qty>0){sauceCart[id].qty--;if(!sauceCart[id].qty)delete sauceCart[id];renderPreview();}}
function exDrinkPlus(id){const d=extrasDrinks.find(x=>x.id===id);if(!d)return;if(!extrasDrinkCart[id])extrasDrinkCart[id]={name:d.name,price:d.price,qty:0};extrasDrinkCart[id].qty++;renderCart();}
function exDrinkMinus(id){if(extrasDrinkCart[id]&&extrasDrinkCart[id].qty>0){extrasDrinkCart[id].qty--;if(!extrasDrinkCart[id].qty)delete extrasDrinkCart[id];renderCart();}}
function selectTable(v){selectedTable=v;renderPreview();}

// ===== ORDER ACTIONS (SYNCED VIA FIREBASE) =====
function toggleSet(oid){
  const o=orders.find(x=>x.id===oid);
  if(o){fbUpdateOrder(o,{isSet:!o.isSet});}
}

function confirmOrder(){
  if(!selectedTable)return;const ids=Object.keys(cart).filter(id=>getCartQty(id)>0);const di=Object.keys(extrasDrinkCart).filter(k=>extrasDrinkCart[k].qty>0);if(!ids.length&&!di.length)return;
  showModal('Confirm Order',`Place order for ${selectedTable}?`,()=>{
    // Use transaction for counter to avoid race conditions
    counterRef.transaction(current => (current || 0) + 1, (err, committed, snap) => {
      if (err || !committed) { showToast('Error placing order', true); return; }
      const newCounter = snap.val();
      const oid = String(newCounter).padStart(3,'0');
      const now=new Date();const ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');const all=[];
      ids.forEach(id=>{const split=Array.isArray(cart[id]);const name=allItemLookup[id].name;const price=getItemUnitPrice(id);
        if(split){const showIdx=cart[id].length>1;cart[id].forEach((u,idx)=>{const eq=u.eggs||0;const sg=u.sugar||0;all.push({name:name+(showIdx?' #'+(idx+1):''),price,qty:1,cook:u.cook||null,eggs:eq,eggStyle:u.eggStyle||null,eggCost:eq*EGG_PRICE,feeCost:0,freeDrink:(u.freeDrink&&u.freeDrink!=='None')?u.freeDrink:null,sugar:sg});});}
        else{const c=cart[id];const sf=getServiceFee(id);const fee=c.eatInFee?sf*c.qty:0;all.push({name,price,qty:c.qty,cook:c.cook||null,eggs:0,eggStyle:null,eggCost:0,feeCost:fee,freeDrink:null,sugar:0});}
      });
      di.forEach(id=>all.push({name:extrasDrinkCart[id].name,price:extrasDrinkCart[id].price,qty:extrasDrinkCart[id].qty,cook:null,eggs:0,eggStyle:null,eggCost:0,feeCost:0,freeDrink:null,sugar:0}));
      const si=Object.keys(sauceCart).filter(k=>sauceCart[k].qty>0);const sl=si.map(id=>{const s=sauceOptions.find(x=>x.id===id);return s.name+' x'+sauceCart[id].qty;});
      const ft=calcFoodTotal(),dt=di.reduce((s,id)=>s+extrasDrinkCart[id].price*extrasDrinkCart[id].qty,0);
      const order={id:oid,table:selectedTable,time:ts,items:all,sauces:sl,notes:orderNotes.trim()||null,total:ft+dt,status:'active',completedTime:null,isSet:false};
      fbSaveOrder(order);
      cart={};extrasDrinkCart={};sauceCart={};orderNotes='';selectedTable=null;
      closeModal();showPage('active');renderMenu();
      showToast('✅ Order #'+oid+' placed!');
    });
  });
}

function markComplete(oid){
  showModal('Complete',`Mark #${oid} completed?`,()=>{
    const o=orders.find(x=>x.id===oid);
    if(o){const now=new Date();const ct=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');fbUpdateOrder(o,{status:'completed',completedTime:ct});}
    closeModal();showToast('✅ Order #'+oid+' completed!');
  });
}
function deleteOrder(oid){
  const o=orders.find(x=>x.id===oid);if(!o)return;
  showModalDanger('Delete',`Delete order #${oid}?`,()=>{
    fbDeleteOrder(o);delete expandedOrders[oid];closeModal();
    showToast('🗑️ Order #'+oid+' deleted!',true);
  });
}
function clearAllOrders(){
  showModalDanger('Clear All','Delete ALL records?',()=>{
    fbClearAllOrders();expandedOrders={};closeModal();
    showToast('🗑️ All orders cleared!',true);
  });
}
function toggleOrderExpand(oid){expandedOrders[oid]=!expandedOrders[oid];const o=orders.find(x=>x.id===oid);if(o&&o.status==='active')renderActiveOrders();else renderCompletedOrders();}

function showPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));const nb=document.querySelectorAll('.nav-btn');
  switch(p){
    case 'menu':document.getElementById('page-menu').classList.add('active');nb[0].classList.add('active');renderMenu();break;
    case 'cart':document.getElementById('page-cart').classList.add('active');nb[1].classList.add('active');renderCart();break;
    case 'preview':document.getElementById('page-preview').classList.add('active');nb[1].classList.add('active');renderPreview();break;
    case 'active':document.getElementById('page-active').classList.add('active');nb[2].classList.add('active');renderActiveOrders();break;
    case 'completed':document.getElementById('page-completed').classList.add('active');nb[3].classList.add('active');renderCompletedOrders();break;
    case 'prices':document.getElementById('page-prices').classList.add('active');nb[4].classList.add('active');renderPriceEditor();break;
  }
}
function updateBadges(){const cc=getTotalCartCount();const cb=document.getElementById('cartBadge');if(cc>0){cb.style.display='flex';cb.textContent=cc;}else cb.style.display='none';const ac=orders.filter(o=>o.status==='active').length;const ab=document.getElementById('activeBadge');if(ac>0){ab.style.display='flex';ab.textContent=ac;}else ab.style.display='none';}
let modalCallback=null;
function showModal(t,m,fn){document.getElementById('modalTitle').textContent=t;document.getElementById('modalMsg').textContent=m;modalCallback=fn;const b=document.getElementById('modalConfirmBtn');b.className='btn-sm btn-confirm';b.textContent='Confirm';b.onclick=()=>{if(modalCallback)modalCallback();};document.getElementById('confirmModal').classList.add('show');}
function showModalDanger(t,m,fn){document.getElementById('modalTitle').textContent=t;document.getElementById('modalMsg').textContent=m;modalCallback=fn;const b=document.getElementById('modalConfirmBtn');b.className='btn-sm btn-danger';b.textContent='Delete';b.onclick=()=>{if(modalCallback)modalCallback();};document.getElementById('confirmModal').classList.add('show');}
function closeModal(){document.getElementById('confirmModal').classList.remove('show');modalCallback=null;}
renderMenu();updateBadges();
</script>
</body>
</html>
